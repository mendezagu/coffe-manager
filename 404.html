<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tavolapp se mudó</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://app.tavolapp.app/">
  <meta http-equiv="refresh" content="3;url=https://app.tavolapp.app/">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf1ea;font-family:system-ui,'Segoe UI',Roboto,sans-serif;color:#1e2b24;text-align:center;padding:24px}
    main{max-width:420px}h1{font-size:22px;margin:0 0 8px}p{color:#55655b;line-height:1.5;margin:6px 0}
    a{display:inline-block;margin-top:14px;background:#1d5b3e;color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:12px}
  </style>
</head>
<body>
  <main>
    <h1>Tavolapp tiene una nueva dirección</h1>
    <p>Te estamos llevando a <b>app.tavolapp.app</b>…</p>
    <a id="go" href="https://app.tavolapp.app/">Ir ahora</a>
  </main>
  <script>
    // Misma ruta en la dirección nueva (por ejemplo, los QR de mesa ya impresos siguen funcionando)
    var path = location.pathname.replace(/^\/coffe-manager/, '') || '/';
    if (path === '/index.html') path = '/';
    var target = 'https://app.tavolapp.app' + path + location.search + location.hash;
    document.getElementById('go').href = target;
    // Quita la versión vieja de la app que haya quedado instalada en este navegador (service worker y archivos guardados)
    var cleanup = Promise.resolve();
    if ('serviceWorker' in navigator) {
      cleanup = navigator.serviceWorker.getRegistrations()
        .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
        .catch(function () {});
    }
    if (window.caches) {
      cleanup = cleanup.then(function () { return caches.keys(); })
        .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
        .catch(function () {});
    }
    cleanup.then(function () { location.replace(target); });
    setTimeout(function () { location.replace(target); }, 1500);
  </script>
</body>
</html>
