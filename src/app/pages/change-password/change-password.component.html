<div class="flex min-h-screen flex-col bg-sage-50">

  <header class="flex items-center justify-between gap-3 px-3 py-4 sm:px-8">
    <span class="inline-flex items-baseline whitespace-nowrap font-bold text-sage-800" role="img" aria-label="Tavolapp" style="font-size: 30px; line-height: 1; letter-spacing: -0.035em">
      <span>Tav</span>
      <svg viewBox="0 0 100 100" aria-hidden="true" style="width: 0.6em; height: 0.6em; margin: 0 0.035em; transform: translateY(0.015em); flex: none">
        <circle cx="50" cy="50" r="48" stroke-width="4" fill="#f6f8f4" stroke="#1d5b3e" />
        <circle cx="50" cy="50" r="38.5" fill="none" stroke-width="6" stroke="#1d5b3e" />
        <circle cx="50" cy="50" r="29" stroke-width="2.5" fill="#f6f8f4" stroke="#1d5b3e" stroke-opacity=".35" />
        <g fill="none" stroke="#1d5b3e" stroke-linecap="round" stroke-linejoin="round">
          <path d="M34 31 V44 M39 31 V44 M44 31 V44" stroke-width="2.6" />
          <path d="M34 44 Q39 52 44 44" stroke-width="2.6" />
          <path d="M39 50 V69" stroke-width="3.6" />
        </g>
        <path d="M58.5 31 C66.5 36 67 49 62.5 56 H58.5 Z" fill="#8a2a1c" />
        <rect x="58.5" y="55" width="4" height="14" rx="2" fill="#8a2a1c" />
      </svg>
      <span>lapp</span>
    </span>
    <button type="button" (click)="cancel()" class="rounded-lg px-3 py-2 text-sm font-medium text-sage-500 transition-colors hover:bg-sage-100 hover:text-sage-800">
      Salir
    </button>
  </header>

  <main class="flex flex-1 items-start justify-center px-1.5 pb-10 pt-2 sm:items-center sm:px-6">
    <section class="w-full max-w-[460px] rounded-card bg-white p-4 shadow-soft-lg sm:p-8" aria-labelledby="cp-title">
      <div class="mb-5 flex items-start gap-4">
        <span class="grid h-12 w-12 flex-none place-items-center rounded-xl bg-cafe-green-50 text-cafe-green-700">
          <mat-icon>lock_reset</mat-icon>
        </span>
        <div class="min-w-0">
          <h1 id="cp-title" class="m-0 text-2xl font-bold tracking-tight text-sage-900">Elegí tu contraseña</h1>
          <p class="m-0 mt-1 text-sm text-sage-500">
            Por seguridad, antes de empezar tenés que cambiar la contraseña que te dieron por una tuya. Después vas a volver a ingresar con la nueva.
          </p>
        </div>
      </div>

      <app-change-password-form [first]="true" (changed)="onChanged()"></app-change-password-form>
    </section>
  </main>
</div>
