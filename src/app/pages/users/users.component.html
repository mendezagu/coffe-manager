<div>
    <!-- Código del local: con él y su usuario, el personal ingresa -->
    <section *ngIf="loginCode" class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-card border border-cafe-green-200 bg-cafe-green-50 p-4" aria-label="Código del local">
      <div class="flex min-w-0 items-center gap-3">
        <span class="flex h-11 w-11 flex-none items-center justify-center rounded-xl bg-cafe-green-700 text-white"><mat-icon>storefront</mat-icon></span>
        <div class="min-w-0">
          <p class="m-0 text-[11px] font-bold uppercase tracking-wider text-cafe-green-800">El código de tu local</p>
          <ng-container *ngIf="!editingCode; else editCode">
            <p class="m-0 truncate font-mono text-2xl font-bold text-cafe-green-900">{{ loginCode }}</p>
          </ng-container>
          <ng-template #editCode>
            <input type="text" [(ngModel)]="codeDraft" name="codeDraft" maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false" (keyup.enter)="saveCode()"
              class="mt-1 w-56 max-w-full rounded-lg border border-cafe-green-200 bg-white px-3 py-1.5 font-mono text-base text-sage-900 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25" />
          </ng-template>
          <p class="m-0 mt-1 text-xs text-cafe-green-800">Tu personal ingresa con este código y su usuario.</p>
        </div>
      </div>
      <div class="flex flex-wrap gap-2">
        <ng-container *ngIf="!editingCode; else editButtons">
          <button type="button" (click)="copyCode()" class="inline-flex h-10 items-center gap-1.5 rounded-lg border border-cafe-green-200 bg-white px-3 text-sm font-bold text-cafe-green-800"><mat-icon class="!h-4 !w-4 !text-base">content_copy</mat-icon> Copiar</button>
          <button type="button" (click)="startEditCode()" class="inline-flex h-10 items-center rounded-lg border border-cafe-green-200 bg-white px-3 text-sm font-bold text-cafe-green-800">Cambiar</button>
        </ng-container>
        <ng-template #editButtons>
          <button type="button" (click)="saveCode()" [disabled]="savingCode" class="inline-flex h-10 items-center rounded-lg bg-cafe-green-700 px-4 text-sm font-bold text-white disabled:opacity-50">{{ savingCode ? 'Guardando…' : 'Guardar' }}</button>
          <button type="button" (click)="editingCode = false" class="inline-flex h-10 items-center rounded-lg border border-cafe-green-200 bg-white px-3 text-sm font-bold text-cafe-green-800">Cancelar</button>
        </ng-template>
      </div>
    </section>

    <!-- Alta -->
    <form (ngSubmit)="create()" #f="ngForm" class="bg-sage-50 border border-sage-200 rounded-card p-5 mb-6 grid gap-3 sm:grid-cols-2">
      <h2 class="sm:col-span-2 font-bold text-sage-800">Nuevo usuario</h2>

      <label class="block">
        <span class="block text-xs font-bold text-sage-500 mb-1.5">Nombre</span>
        <input name="name" [(ngModel)]="form.name" required
          class="w-full px-4 py-2.5 border border-sage-200 rounded-lg text-sm text-sage-900 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700" />
      </label>

      <label class="block">
        <span class="block text-xs font-bold text-sage-500 mb-1.5">Usuario</span>
        <input name="email" type="text" [(ngModel)]="form.email" required pattern="[A-Za-z0-9._@+\-]{3,60}" placeholder="por ejemplo: mozo1" autocomplete="off" autocapitalize="none" spellcheck="false"
          class="w-full px-4 py-2.5 border border-sage-200 rounded-lg text-sm text-sage-900 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700" />
      </label>

      <label class="block">
        <span class="block text-xs font-bold text-sage-500 mb-1.5">Contraseña (mín. 8)</span>
        <input name="password" type="password" appPasswordToggle [(ngModel)]="form.password" required minlength="8" autocomplete="new-password"
          class="w-full px-4 py-2.5 border border-sage-200 rounded-lg text-sm text-sage-900 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700" />
      </label>

      <label class="block">
        <span class="block text-xs font-bold text-sage-500 mb-1.5">Rol</span>
        <select name="role" [(ngModel)]="form.role"
          class="w-full px-4 py-2.5 border border-sage-200 rounded-lg text-sm text-sage-900 bg-white focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700">
          <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
        </select>
      </label>

      <div class="sm:col-span-2">
        <button type="submit" [disabled]="f.invalid || saving"
          class="px-5 py-2.5 bg-cafe-green-700 hover:bg-cafe-green-800 text-white font-bold text-sm rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          {{ saving ? 'Creando…' : 'Crear usuario' }}
        </button>
      </div>
    </form>

    <!-- Listado -->
    <div class="bg-white border border-sage-200 rounded-card overflow-hidden">
      <p *ngIf="loading" class="p-5 text-sage-600 text-sm">Cargando…</p>
      <p *ngIf="!loading && users.length === 0" class="p-5 text-sage-600 text-sm">No hay usuarios.</p>

      <ul class="divide-y divide-sage-200">
        <li *ngFor="let u of users" class="p-4 flex flex-wrap items-center gap-3" [class.opacity-60]="!u.active">
          <div class="min-w-0 flex-1 basis-48">
            <p class="font-bold text-sage-900 truncate">
              {{ u.name }}
              <span *ngIf="u.id === currentUserId" class="ml-1 text-xs font-medium text-cafe-green-700">(vos)</span>
              <span *ngIf="!u.active" class="ml-1 text-xs font-medium text-cafe-red-700">Inactivo</span>
            </p>
            <p class="text-sm text-sage-600 truncate">{{ u.email }}</p>
          </div>

          <select [ngModel]="u.role" (ngModelChange)="changeRole(u, $event)" [attr.aria-label]="'Rol de ' + u.name"
            class="px-3 py-2 border border-sage-200 rounded-lg text-sm bg-white">
            <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
          </select>

          <div class="flex gap-2">
            <button type="button" (click)="resetPassword(u)"
              class="px-3 py-2 text-sm font-medium rounded-lg border border-sage-200 text-sage-700 hover:bg-sage-50">Contraseña</button>
            <button type="button" (click)="toggleActive(u)" [disabled]="u.id === currentUserId"
              class="px-3 py-2 text-sm font-medium rounded-lg border border-sage-200 text-sage-700 hover:bg-sage-50 disabled:opacity-40 disabled:cursor-not-allowed">
              {{ u.active ? 'Desactivar' : 'Activar' }}
            </button>
            <button type="button" (click)="remove(u)" [disabled]="u.id === currentUserId"
              class="px-3 py-2 text-sm font-medium rounded-lg bg-cafe-red-50 text-cafe-red-700 hover:bg-cafe-red-100 disabled:opacity-40 disabled:cursor-not-allowed">Eliminar</button>
          </div>
        </li>
      </ul>
    </div>

</div>
