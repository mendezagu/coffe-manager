<div class="w-full min-h-screen flex items-center justify-center bg-sage-50 px-4 py-10">
  <div class="w-full max-w-[400px] bg-white rounded-card shadow-soft-lg p-6 sm:p-8">

    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <img
        class="w-20 h-20 rounded-full object-cover ring-4 ring-sage-100 shadow-md"
        src="./assets/nuovo-cafe.jpg"
        alt="Nuovo Caffe"
      />
    </div>

    <!-- Título -->
    <h2 class="text-center text-2xl font-bold text-sage-900">Nuovo Caffé</h2>
    <p class="text-center text-sage-500 text-sm mt-1 mb-6">Bienvenido</p>

    <!-- Formulario -->
    <form [formGroup]="formLogin" (ngSubmit)="onSubmit()" class="w-full">

      <div class="mb-4">
        <label class="block text-xs font-bold text-sage-500 mb-1.5">Email</label>
        <input
          type="email"
          formControlName="email"
          required
          class="w-full px-4 py-2.5 border border-sage-200 rounded-lg text-sm text-sage-900 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700 transition-all"
        />
      </div>

      <div class="mb-6">
        <label class="block text-xs font-bold text-sage-500 mb-1.5">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          required
          class="w-full px-4 py-2.5 border border-sage-200 rounded-lg text-sm text-sage-900 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700 transition-all"
        />
      </div>

      <p *ngIf="error" role="alert" class="mb-4 px-3 py-2 rounded-lg bg-cafe-red-50 text-cafe-red-700 text-sm font-medium">{{ error }}</p>

      <!-- Botón de Iniciar Sesión -->
      <button
        type="submit"
        [disabled]="formLogin.invalid || loading"
        class="w-full py-2.5 bg-cafe-green-700 hover:bg-cafe-green-800 text-white font-bold text-sm rounded-lg transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ loading ? 'Ingresando…' : 'Ingresar' }}
      </button>

      <p class="text-center text-sage-500 text-xs mt-4">¿No tenés usuario? Pedile uno al administrador.</p>

    </form>
  </div>
</div>
