<div class="w-full min-h-screen bg-sage-100 p-4 sm:p-6 lg:p-10">
  <div class="max-w-5xl mx-auto">

    <!-- Header -->
    <div class="flex items-center gap-4 mb-8">
      <img
        class="w-14 h-14 rounded-full object-cover ring-4 ring-sage-100 shadow-md"
        src="./assets/nuovo-cafe.jpg"
        alt="Nuovo Caffe"
      />
      <div>
        <h2 class="text-2xl sm:text-3xl font-bold text-sage-900">Estadísticas de Nuovo Caffé</h2>
        <p class="text-sage-500 text-sm mt-0.5">Rendimiento por mesa, mozo y día</p>
      </div>
    </div>

    <!-- Ingresos por mesa -->
    <div class="bg-white rounded-card shadow-soft p-5 sm:p-6 mb-6">
      <h4 class="flex items-center gap-2 text-base font-bold text-sage-900 mb-4">
        <mat-icon class="!w-5 !h-5 !text-xl text-sage-600">payments</mat-icon>
        Mesas con más ingresos
      </h4>
      <canvas id="tableRevenueChart"></canvas>
    </div>

    <!-- Mozos con más mesas atendidas -->
    <div class="bg-white rounded-card shadow-soft p-5 sm:p-6 mb-6">
      <h4 class="flex items-center gap-2 text-base font-bold text-sage-900 mb-4">
        <mat-icon class="!w-5 !h-5 !text-xl text-sage-600">person</mat-icon>
        Mozos con más mesas atendidas
      </h4>
      <canvas id="waiterChart"></canvas>
    </div>

    <!-- Días con más ventas -->
    <div class="bg-white rounded-card shadow-soft p-5 sm:p-6 mb-6">
      <h4 class="flex items-center gap-2 text-base font-bold text-sage-900 mb-4">
        <mat-icon class="!w-5 !h-5 !text-xl text-sage-600">calendar_month</mat-icon>
        Días con más ventas
      </h4>
      <canvas id="salesByDayChart"></canvas>
    </div>

  </div>
</div>
