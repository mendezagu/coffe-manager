<div class="w-full min-h-screen bg-sage-100">
  <header class="page-header">
    <div class="page-header__inner max-w-5xl">
      <div class="flex min-w-0 items-center gap-4">
        <div class="page-header__icon"><mat-icon>bar_chart</mat-icon></div>
        <div class="min-w-0">
          <h1 class="page-title">Estadísticas</h1>
          <p class="page-sub">Rendimiento por mesa, mozo y día</p>
        </div>
      </div>
    </div>
  </header>

  <div class="px-4 py-6 sm:px-8 sm:py-8">
  <div class="max-w-5xl mx-auto">

    <!-- Ingresos por mesa -->
    <div class="bg-white rounded-card shadow-soft p-5 sm:p-6 mb-6">
      <h4 class="flex items-center gap-2 text-base font-bold text-sage-900 mb-4">
        <mat-icon class="!w-5 !h-5 !text-xl text-sage-600">payments</mat-icon>
        Mesas con más ingresos
      </h4>
      <canvas id="tableRevenueChart"></canvas>
    </div>

    <!-- Mozos con más mesas atendidas -->
    <div class="bg-white rounded-card shadow-soft p-5 sm:p-6 mb-6">
      <h4 class="flex items-center gap-2 text-base font-bold text-sage-900 mb-4">
        <mat-icon class="!w-5 !h-5 !text-xl text-sage-600">person</mat-icon>
        Mozos con más mesas atendidas
      </h4>
      <canvas id="waiterChart"></canvas>
    </div>

    <!-- Días con más ventas -->
    <div class="bg-white rounded-card shadow-soft p-5 sm:p-6 mb-6">
      <h4 class="flex items-center gap-2 text-base font-bold text-sage-900 mb-4">
        <mat-icon class="!w-5 !h-5 !text-xl text-sage-600">calendar_month</mat-icon>
        Días con más ventas
      </h4>
      <canvas id="salesByDayChart"></canvas>
    </div>

  </div>
  </div>
</div>
