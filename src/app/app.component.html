<mat-drawer-container class="example-container" autosize>

  <!-- Sidebar (solo visible si está autenticado) -->
  <mat-drawer #sidenav class="example-sidenav d-flex flex-column" mode="side" *ngIf="isLoggedIn">
    <div class="flex items-center gap-3 px-2 mb-6">
      <img
        class="w-11 h-11 rounded-full object-cover ring-2 ring-white shadow-[0_0_0_3px_#cfd8cb]"
        [src]="(settings.settings$ | async)?.logoUrl || ''"
        [alt]="(settings.settings$ | async)?.name"
        *ngIf="(settings.settings$ | async)?.logoUrl"
      />
      <div>
        <span class="block text-sage-800 font-bold text-lg leading-tight">{{ (settings.settings$ | async)?.name }}</span>
        <span *ngIf="user$ | async as user" class="sm:hidden inline-block mt-1 px-2.5 py-0.5 rounded-full bg-cafe-green-50 text-cafe-green-700 text-xs font-bold">{{ roleLabels[user.role] }}</span>
      </div>
    </div>

    <ng-container *ngIf="role$ | async as role">

      <!-- Operación: lo que se usa todo el día -->
      <p class="px-3 mt-4 mb-1 text-[11px] font-bold uppercase tracking-wider text-sage-400">Operación</p>
      <button mat-button routerLink="/home" *ngIf="role !== 'kitchen' && role !== 'bar'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
        <mat-icon fontIcon="storefront"></mat-icon>
        Inicio
        <span *ngIf="(qr.inbox$ | async) as q" [hidden]="(q.requests.length + q.calls.length) === 0"
          class="ml-auto min-w-[20px] px-1.5 rounded-full bg-cafe-red-700 text-white text-[11px] font-bold leading-5 text-center"
          [attr.aria-label]="(q.requests.length + q.calls.length) + ' pedidos QR esperando'">{{ q.requests.length + q.calls.length }}</span>
      </button>
      <button mat-button routerLink="/kitchen" *ngIf="role === 'admin' || role === 'kitchen' || role === 'bar'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
        <mat-icon fontIcon="restaurant"></mat-icon>
        {{ role === 'bar' ? 'Barra' : 'Cocina' }}
      </button>
      <button mat-button routerLink="/cash" *ngIf="role === 'admin' || role === 'cashier'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
        <mat-icon fontIcon="point_of_sale"></mat-icon>
        Caja
      </button>

      <!-- Negocio: los números -->
      <ng-container *ngIf="role === 'admin'">
      <p class="px-3 mt-4 mb-1 text-[11px] font-bold uppercase tracking-wider text-sage-400">Negocio</p>
      <button mat-button routerLink="/balance" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
        <mat-icon fontIcon="paid"></mat-icon>
        Balance
      </button>
      <button mat-button routerLink="/reports" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
        <mat-icon fontIcon="bar_chart"></mat-icon>
        Reportes
      </button>
      <button mat-button routerLink="/inventory" *ngIf="(settings.settings$ | async)?.inventoryActive" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
        <mat-icon fontIcon="inventory_2"></mat-icon>
        Inventario
      </button>

      <!-- Configuración: casi nunca -->
      <p class="px-3 mt-4 mb-1 text-[11px] font-bold uppercase tracking-wider text-sage-400">Configuración</p>
      <button mat-button routerLink="/admin" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
        <mat-icon fontIcon="settings"></mat-icon>
        Administrar
      </button>
      <button mat-button routerLink="/settings" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
        <mat-icon fontIcon="business"></mat-icon>
        Mi negocio
      </button>
      <button mat-button routerLink="/logs" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
        <mat-icon fontIcon="visibility_lock"></mat-icon>
        Logs
      </button>
      </ng-container>
    </ng-container>

    <div class="flex-1"></div>

    <button mat-button *ngIf="isLoggedIn" (click)="logout()" class="!bg-cafe-red-50 !text-cafe-red-700 !rounded-xl !h-11 !font-bold">
      <mat-icon fontIcon="logout"></mat-icon>
      Cerrar sesión
    </button>
  </mat-drawer>

  <mat-drawer-content>

    <!-- Encabezado: solo con sesión iniciada -->
    <div *ngIf="isLoggedIn" class="sticky top-0 z-10">
      <mat-toolbar class="custom-toolbar d-flex justify-content-between align-items-center">

        <!-- Izquierda: menú y marca -->
        <div class="cont-1 d-flex align-items-center gap-2 min-w-0">
          <button mat-icon-button (click)="sidenav.toggle()" aria-label="Abrir o cerrar el menú">
            <mat-icon class="!text-sage-600">menu</mat-icon>
          </button>
          <img
            class="rounded-full flex-shrink-0"
            style="width: 34px; height: 34px; object-fit: cover;"
            *ngIf="(settings.settings$ | async)?.logoUrl"
            [src]="(settings.settings$ | async)?.logoUrl"
            [alt]="(settings.settings$ | async)?.name"
          />
          <span class="text-sage-800 font-bold text-lg truncate">{{ (settings.settings$ | async)?.name }}</span>
        </div>

        <!-- Derecha: alertas, caja, turno y usuario -->
        <div class="d-flex align-items-center gap-2">

          <!-- Alertas: solo aparecen si hay algo que atender -->
          <button *ngIf="(qr.inbox$ | async) as q" [hidden]="!q.active || (q.requests.length + q.calls.length) === 0" type="button" (click)="openQrInbox()"
            class="relative w-10 h-10 rounded-full flex items-center justify-center bg-cafe-red-50 text-cafe-red-700 hover:bg-cafe-red-100 transition-colors"
            [attr.aria-label]="'Pedidos por QR: ' + q.requests.length + ' pedidos y ' + q.calls.length + ' avisos esperando'"
            title="Pedidos y avisos de los clientes">
            <mat-icon class="!w-6 !h-6 !text-2xl animate-pulse">notifications_active</mat-icon>
            <span class="absolute -top-0.5 -right-0.5 min-w-[18px] px-1 rounded-full bg-cafe-red-700 text-white text-[11px] font-bold leading-[18px] text-center">{{ q.requests.length + q.calls.length }}</span>
          </button>

          <a *ngIf="stock && (stock.lowCount + stock.outCount) > 0" routerLink="/inventory"
            class="relative w-10 h-10 rounded-full flex items-center justify-center bg-yellow-100 text-yellow-800 no-underline"
            [attr.aria-label]="'Inventario: ' + stock.outCount + ' agotados y ' + stock.lowCount + ' con stock bajo'"
            [title]="(stock.outCount + stock.lowCount) + ' insumos por reponer'">
            <mat-icon class="!w-6 !h-6 !text-2xl">inventory_2</mat-icon>
            <span class="absolute -top-0.5 -right-0.5 min-w-[18px] px-1 rounded-full bg-yellow-600 text-white text-[11px] font-bold leading-[18px] text-center">{{ stock.outCount + stock.lowCount }}</span>
          </a>

          <!-- Estado de la caja (administrador y cajero): ícono con un punto verde (abierta) o rojo (cerrada) -->
          <a *ngIf="((role$ | async) === 'admin' || (role$ | async) === 'cashier') && (cash.state$ | async) as c" routerLink="/cash"
            class="relative w-10 h-10 rounded-full flex items-center justify-center no-underline transition-colors"
            [ngClass]="c.open ? 'bg-cafe-green-50 text-cafe-green-700 hover:bg-cafe-green-100' : 'bg-cafe-red-50 text-cafe-red-700 hover:bg-cafe-red-100'"
            [attr.aria-label]="c.open ? 'Caja abierta' : 'Caja cerrada'" [title]="c.open ? 'Caja abierta' : 'Caja cerrada'">
            <mat-icon class="!w-6 !h-6 !text-2xl">point_of_sale</mat-icon>
            <span class="absolute top-0 right-0 w-3 h-3 rounded-full border-2 border-white" [ngClass]="c.open ? 'bg-cafe-green-700' : 'bg-cafe-red-700'"></span>
          </a>

          <!-- Turno y fecha -->
          <div class="hidden md:flex items-center gap-2.5 pl-3 ml-1 border-l-[1px] border-sage-200">
            <span class="w-9 h-9 rounded-xl bg-sage-100 text-sage-600 flex items-center justify-center">
              <mat-icon class="!w-5 !h-5 !text-xl">{{ shiftIcon }}</mat-icon>
            </span>
            <div class="flex flex-col leading-tight">
              <span class="text-sage-800 text-sm font-bold">{{ shift }}</span>
              <span class="text-sage-500 text-xs">{{ currentDate }}</span>
            </div>
          </div>
        </div>

      </mat-toolbar>
    </div>

    <!-- Aquí siempre cargan las rutas -->
    <router-outlet></router-outlet>

  </mat-drawer-content>

</mat-drawer-container>
