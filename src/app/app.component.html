<mat-drawer-container class="example-container" autosize>

  <!-- Sidebar (solo visible si está autenticado) -->
  <mat-drawer #sidenav class="example-sidenav d-flex flex-column" mode="side" *ngIf="isLoggedIn">
    <div class="flex items-center gap-3 px-2 mb-6">
      <img
        class="w-11 h-11 rounded-full object-cover ring-2 ring-white shadow-[0_0_0_3px_#cfd8cb]"
        [src]="(settings.settings$ | async)?.logoUrl || ''"
        [alt]="(settings.settings$ | async)?.name"
        *ngIf="(settings.settings$ | async)?.logoUrl"
      />
      <div>
        <span class="block text-sage-800 font-bold text-lg leading-tight">{{ (settings.settings$ | async)?.name }}</span>
        <span *ngIf="user$ | async as user" class="sm:hidden inline-block mt-1 px-2.5 py-0.5 rounded-full bg-cafe-green-50 text-cafe-green-700 text-xs font-bold">{{ roleLabels[user.role] }}</span>
      </div>
    </div>

    <button mat-button routerLink="/home" *ngIf="(role$ | async) !== 'kitchen' && (role$ | async) !== 'bar'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
      <mat-icon fontIcon="storefront"></mat-icon>
      Inicio
    </button>

    <button mat-button routerLink="/kitchen" *ngIf="(role$ | async) === 'admin' || (role$ | async) === 'kitchen' || (role$ | async) === 'bar'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
      <mat-icon fontIcon="restaurant"></mat-icon>
      {{ (role$ | async) === 'bar' ? 'Barra' : 'Cocina' }}
    </button>

    <!-- ✅ Botón Administrar solo para Admin -->
    <button mat-button routerLink="/admin" *ngIf="(role$ | async) === 'admin'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
      <mat-icon fontIcon="settings"></mat-icon>
      Administrar
    </button>

    <button mat-button routerLink="/cash" *ngIf="(role$ | async) === 'admin' || (role$ | async) === 'cashier'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
      <mat-icon fontIcon="point_of_sale"></mat-icon>
      Caja
    </button>

    <button mat-button routerLink="/balance" *ngIf="(role$ | async) === 'admin'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
      <mat-icon fontIcon="paid"></mat-icon>
      Balance
    </button>

    <button mat-button routerLink="/reports" *ngIf="(role$ | async) === 'admin'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
      <mat-icon fontIcon="bar_chart"></mat-icon>
      Reportes
    </button>

    <button mat-button routerLink="/settings" *ngIf="(role$ | async) === 'admin'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
      <mat-icon fontIcon="business"></mat-icon>
      Mi negocio
    </button>

    <button mat-button routerLink="/logs" *ngIf="(role$ | async) === 'admin'" routerLinkActive="!bg-cafe-green-50 !text-cafe-green-700 !font-bold" class="!text-sage-600 !rounded-xl !mb-1 !h-11 !justify-start">
      <mat-icon fontIcon="visibility_lock"></mat-icon>
      Logs
    </button>

    <div class="flex-1"></div>

    <button mat-button *ngIf="isLoggedIn" (click)="logout()" class="!bg-cafe-red-50 !text-cafe-red-700 !rounded-xl !h-11 !font-bold">
      <mat-icon fontIcon="logout"></mat-icon>
      Cerrar sesión
    </button>
  </mat-drawer>

  <mat-drawer-content>

    <!-- ✅ Toolbar solo aparece si está autenticado -->
    <div *ngIf="isLoggedIn" class="sticky top-0 z-10">
      <mat-toolbar class="custom-toolbar d-flex justify-content-between align-items-center">

        <!-- Contenido a la izquierda -->
        <div class="cont-1 d-flex align-items-center gap-2">
          <!-- Botón de menú (solo visible si está autenticado) -->
          <button mat-icon-button (click)="sidenav.toggle()">
            <mat-icon class="!text-sage-600">menu</mat-icon>
          </button>

          <img
            class="rounded-full"
            style="width: 34px; height: 34px; object-fit: cover;"
            *ngIf="(settings.settings$ | async)?.logoUrl"
            [src]="(settings.settings$ | async)?.logoUrl"
            [alt]="(settings.settings$ | async)?.name"
          />
          <span class="text-sage-800 font-bold text-lg">{{ (settings.settings$ | async)?.name }}</span>
        </div>

        <!-- Contenido a la derecha -->
        <div class="d-flex align-items-center gap-2">
        <!-- Usuario y rol -->
        <!-- Estado de la caja (administrador y cajero) -->
        <a *ngIf="((role$ | async) === 'admin' || (role$ | async) === 'cashier') && (cash.state$ | async) as c" routerLink="/cash"
          class="d-flex align-items-center gap-2 px-3 py-1 rounded-full border text-xs font-bold no-underline"
          [ngClass]="c.open ? 'bg-cafe-green-50 border-cafe-green-200 text-cafe-green-700' : 'bg-cafe-red-50 border-cafe-red-200 text-cafe-red-700'"
          [attr.aria-label]="c.open ? 'Caja abierta' : 'Caja cerrada'">
          <span class="w-2 h-2 rounded-full" [ngClass]="c.open ? 'bg-cafe-green-700' : 'bg-cafe-red-700'"></span>
          <span class="hidden sm:inline">{{ c.open ? 'Caja abierta' : 'Caja cerrada' }}</span>
        </a>
        <!-- En pantallas chicas el rol va en el sidebar -->
        <span *ngIf="user$ | async as user" class="hidden sm:inline-block px-3 py-1 rounded-full bg-cafe-green-50 text-cafe-green-700 text-xs font-bold">{{ roleLabels[user.role] }}</span>

        <div class="cont-2 d-flex align-items-center gap-2 px-3.5 py-1.5 rounded-full bg-white border border-sage-300">
          <span class="w-2 h-2 rounded-full bg-cafe-green-700"></span>
          <span class="text-sage-800 font-medium text-sm">{{ shift }}</span>
        </div>
        </div>

      </mat-toolbar>
    </div>

    <!-- Aquí siempre cargan las rutas -->
    <router-outlet></router-outlet>

  </mat-drawer-content>

</mat-drawer-container>
