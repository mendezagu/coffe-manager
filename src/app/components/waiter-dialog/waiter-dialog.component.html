<div class="w-full overflow-hidden rounded-dialog bg-white shadow-dialog">
  <!-- Título -->
  <div class="px-5 pb-1 pt-5 sm:px-6 sm:pt-6">
    <div role="heading" aria-level="2" class="font-jakarta text-xl font-bold text-sage-900">Asignar mozo</div>
    <p class="m-0 mt-[2px] text-sm text-sage-500">Elegí quién atiende esta mesa.</p>
  </div>

  <div class="px-3 sm:px-4">
    <app-guide-hint [step]="2" title="El mozo" text="Elegí quién atiende esta mesa y tocá Asignar. Si atendés solo, elegí tu nombre."></app-guide-hint>
  </div>

  <mat-dialog-content class="thin-scroll max-h-[50vh] overflow-y-auto px-5 py-3 sm:px-6">
    <!-- Los mozos a la vista, de a un toque (sin desplegable) -->
    <div class="grid grid-cols-2 gap-[8px]" role="radiogroup" aria-label="Mozo">
      <button *ngFor="let waiter of waiters" type="button" role="radio" [attr.aria-checked]="selectedWaiterId === waiter._id" (click)="selectedWaiterId = waiter._id"
        class="truncate rounded-xl border px-[14px] py-[13px] text-left text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cafe-green-700"
        [ngClass]="selectedWaiterId === waiter._id ? 'border-cafe-green-700 bg-cafe-green-700 font-semibold text-white' : 'border-sage-200 bg-white text-sage-800 hover:border-sage-300'">
        {{ waiter.name }}
      </button>
    </div>
    <p *ngIf="waiters && waiters.length === 0" class="m-0 py-[16px] text-center text-sm text-sage-500">Todavía no hay mozos cargados.</p>
  </mat-dialog-content>

  <mat-dialog-actions class="flex flex-wrap gap-[8px] border-t border-sage-100 bg-white px-5 py-4 sm:px-6">
    <button type="button"
      class="min-w-[100px] flex-1 rounded-xl border border-sage-300 bg-white px-[16px] py-[11px] text-sm font-semibold text-sage-800 transition-colors hover:bg-sage-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cafe-green-700"
      (click)="onCancel()">
      Cancelar
    </button>

    <button type="button"
      class="min-w-[100px] flex-1 rounded-xl bg-cafe-green-700 px-[16px] py-[11px] text-sm font-semibold text-white transition-colors hover:bg-cafe-green-800 disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cafe-green-700 focus-visible:ring-offset-2"
      (click)="onConfirm()"
      [disabled]="!selectedWaiterId">
      Asignar
    </button>
  </mat-dialog-actions>
</div>
