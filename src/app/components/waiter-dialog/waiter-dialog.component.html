<div class="w-full bg-white rounded-2xl overflow-hidden shadow-2xl">
  <!-- Header -->
  <div class="relative bg-coffee-800 p-3 sm:p-4">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-white/15">
        <mat-icon class="!w-6 !h-6 !text-2xl text-white">person</mat-icon>
      </div>
      <div>
        <h2 class="text-lg sm:text-xl font-bold text-white m-0">Asignar Mozo</h2>
        <p class="text-white/70 text-xs mt-0.5">Selecciona el mozo para esta mesa</p>
      </div>
    </div>
  </div>

  <mat-dialog-content class="p-3 sm:p-4">
    <div class="bg-coffee-50 p-4 rounded-xl border border-coffee-200">
      <label for="waiterSelect" class="flex items-center gap-2.5 text-coffee-900 font-bold text-sm mb-3">
        <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-coffee-100">
          <mat-icon class="!w-5 !h-5 !text-xl text-coffee-700">badge</mat-icon>
        </div>
        <span>Seleccionar Mozo</span>
      </label>
      <div class="relative">
        <select id="waiterSelect"
                class="w-full px-4 py-3 border border-coffee-200 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-coffee-500 focus:border-transparent bg-white shadow-sm transition-all appearance-none cursor-pointer hover:border-coffee-300"
                [(ngModel)]="selectedWaiterId">
          <option value="" disabled selected>Seleccione un mozo...</option>
          <option *ngFor="let waiter of waiters" [value]="waiter._id">
            {{ waiter.name }}
          </option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
          <mat-icon class="!w-5 !h-5 !text-xl text-coffee-500">expand_more</mat-icon>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="flex flex-wrap gap-2 p-3 sm:p-4 bg-coffee-50 border-t border-coffee-100">
    <button
      class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg font-bold text-sm bg-white text-coffee-700 border border-coffee-200 shadow-sm hover:shadow-md transition-all duration-200"
      (click)="onCancel()"
    >
      <mat-icon class="!w-4 !h-4 !text-base">close</mat-icon>
      <span>Cancelar</span>
    </button>

    <button
      class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg font-bold text-sm bg-coffee-700 hover:bg-coffee-800 text-white transition-all duration-200 shadow-md hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="onConfirm()"
      [disabled]="!selectedWaiterId"
    >
      <mat-icon class="!w-4 !h-4 !text-base">check_circle</mat-icon>
      <span>Asignar</span>
    </button>
  </mat-dialog-actions>
</div>
