<div class="w-full bg-white rounded-dialog overflow-hidden shadow-dialog">
  <!-- Header -->
  <div class="relative bg-white px-5 pt-5 pb-3 sm:px-6 sm:pt-6">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-cafe-green-50">
        <mat-icon class="!w-6 !h-6 !text-2xl text-cafe-green-700">person</mat-icon>
      </div>
      <div>
        <h2 class="text-lg sm:text-xl font-bold text-sage-900 m-0">Asignar Mozo</h2>
        <p class="text-sage-500 text-xs mt-0.5">Selecciona el mozo para esta mesa</p>
      </div>
    </div>
  </div>

  <div class="px-3 sm:px-4">
    <app-guide-hint [step]="2" title="El mozo" text="Elegí quién atiende esta mesa y tocá Asignar. Si atendés solo, elegí tu nombre."></app-guide-hint>
  </div>

  <mat-dialog-content class="p-3 sm:p-4">
    <div class="bg-sage-50 p-4 rounded-xl border border-sage-200">
      <label for="waiterSelect" class="flex items-center gap-2.5 text-sage-900 font-bold text-sm mb-3">
        <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-sage-100">
          <mat-icon class="!w-5 !h-5 !text-xl text-sage-700">badge</mat-icon>
        </div>
        <span>Seleccionar Mozo</span>
      </label>
      <div class="relative">
        <select id="waiterSelect"
                class="w-full px-4 py-3 border border-sage-200 rounded-lg text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700 bg-white shadow-sm transition-all appearance-none cursor-pointer hover:border-sage-300"
                [(ngModel)]="selectedWaiterId">
          <option value="" disabled selected>Seleccione un mozo...</option>
          <option *ngFor="let waiter of waiters" [value]="waiter._id">
            {{ waiter.name }}
          </option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
          <mat-icon class="!w-5 !h-5 !text-xl text-sage-500">expand_more</mat-icon>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="flex flex-wrap gap-2 p-3 sm:p-4 bg-white border-t border-sage-200">
    <button
      class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg font-bold text-sm bg-white text-sage-700 border border-sage-200 transition-all duration-200"
      (click)="onCancel()"
    >
      <mat-icon class="!w-4 !h-4 !text-base">close</mat-icon>
      <span>Cancelar</span>
    </button>

    <button
      class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg font-bold text-sm bg-cafe-green-700 hover:bg-cafe-green-800 text-white transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="onConfirm()"
      [disabled]="!selectedWaiterId"
    >
      <mat-icon class="!w-4 !h-4 !text-base">check_circle</mat-icon>
      <span>Asignar</span>
    </button>
  </mat-dialog-actions>
</div>
