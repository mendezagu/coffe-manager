<!-- Escenas animadas de cocina (decoración): a la izquierda el cocinero y a la derecha una tabla donde se corta una zanahoria. Solo pantallas anchas. -->
<div class="pointer-events-none absolute bottom-[8%] left-[2%] hidden w-[260px] xl:block 2xl:left-[4%] 2xl:w-[320px]" aria-hidden="true">
    <svg viewBox="0 0 300 260" class="block h-auto w-full" role="presentation">
      <ellipse cx="150" cy="246" rx="140" ry="6" fill="#262d39" opacity=".08" />

      <!-- estante con frascos -->
      <rect x="30" y="64" width="112" height="6" rx="3" fill="#b98a63" />
      <rect x="40" y="42" width="20" height="22" rx="5" fill="#e9b44c" /><rect x="42" y="37" width="16" height="6" rx="2" fill="#8b6f47" />
      <rect x="70" y="46" width="20" height="18" rx="5" fill="#9be7d3" /><rect x="72" y="41" width="16" height="6" rx="2" fill="#8b6f47" />
      <rect x="100" y="40" width="22" height="24" rx="5" fill="#ee7791" /><rect x="102" y="35" width="18" height="6" rx="2" fill="#8b6f47" />

      <!-- cocinero (estilo ilustración plana: sin contornos, piernas largas y colores lisos) -->
      <g class="cook">
        <ellipse cx="236" cy="246" rx="34" ry="5" fill="#262d39" opacity=".12" />
        <!-- piernas -->
        <path d="M222 150 L236 150 L238 240 L224 240 Z" fill="#363f4e" />
        <path d="M236 150 L252 150 L258 240 L243 240 Z" fill="#2b323e" />
        <!-- zapatos -->
        <path d="M222 238 H240 Q242 246 238 246 H220 Q218 240 222 238 Z" fill="#e9b44c" />
        <path d="M242 238 H260 Q264 246 260 246 H241 Q239 241 242 238 Z" fill="#e9b44c" />
        <!-- brazo de atrás, apoyado en la cintura -->
        <path d="M249 98 Q268 118 252 146" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" />
        <path d="M249 98 Q268 118 252 146" fill="none" stroke="#e1e5ea" stroke-width="2" stroke-linecap="round" opacity=".7" />
        <circle cx="251" cy="148" r="5.5" fill="#e59a82" />
        <!-- chaqueta -->
        <path d="M212 96 Q212 88 222 88 H240 Q250 88 250 96 L252 160 H210 Z" fill="#fff" />
        <path d="M236 88 H240 Q250 88 250 96 L252 160 H242 Z" fill="#e1e5ea" opacity=".75" />
        <path d="M231 88 L231 160" stroke="#d3d9e0" stroke-width="2" />
        <g fill="#0b7d66"><circle cx="226" cy="108" r="2.4" /><circle cx="226" cy="124" r="2.4" /><circle cx="226" cy="140" r="2.4" /></g>
        <!-- pañuelo -->
        <path d="M222 88 L240 88 L231 102 Z" fill="#0b7d66" />
        <!-- cuello y cabeza -->
        <rect x="225" y="78" width="12" height="12" rx="4" fill="#e59a82" />
        <circle cx="231" cy="68" r="13.5" fill="#e59a82" />
        <path d="M218 66 Q219 56 231 55 Q243 56 244 66 Q238 59 231 59 Q224 59 218 66 Z" fill="#363f4e" />
        <ellipse cx="217.5" cy="69" rx="2.6" ry="3.8" fill="#d98771" />
        <!-- gorro de cocinero -->
        <path d="M216 56 Q206 50 211 40 Q211 28 224 31 Q231 22 240 31 Q252 28 251 41 Q256 50 246 56 Z" fill="#fff" />
        <path d="M240 31 Q252 28 251 41 Q256 50 246 56 H238 Z" fill="#e1e5ea" opacity=".7" />
        <rect x="215" y="52" width="32" height="8" rx="3" fill="#fff" />
        <rect x="215" y="57" width="32" height="3" rx="1.5" fill="#d3d9e0" />
        <!-- brazo que revuelve la sartén -->
        <g class="cook-arm">
          <path d="M216 100 L203 128" fill="none" stroke="#d3d9e0" stroke-width="15" stroke-linecap="round" />
          <path d="M216 100 L203 128" fill="none" stroke="#fff" stroke-width="12.5" stroke-linecap="round" />
          <path d="M203 128 L188 150" fill="none" stroke="#e59a82" stroke-width="8.5" stroke-linecap="round" />
          <circle cx="186" cy="152" r="5.5" fill="#e59a82" />
        </g>
      </g>
      <!-- mesada -->
      <rect x="24" y="176" width="166" height="68" rx="8" fill="#cdd3da" />
      <path d="M110 184 V238" stroke="#b6c2b2" stroke-width="2" />
      <g fill="#8a94a4"><circle cx="102" cy="206" r="3" /><circle cx="118" cy="206" r="3" /><circle cx="150" cy="206" r="3" /><circle cx="166" cy="206" r="3" /></g>
      <rect x="16" y="162" width="182" height="15" rx="7" fill="#667184" />

      <!-- hornalla con llama -->
      <ellipse cx="124" cy="162" rx="40" ry="4" fill="#363f4e" />
      <g class="flame" fill="#e6834a">
        <path d="M100 162 q3 -9 6 0 z" /><path d="M112 162 q3 -12 6 0 z" /><path d="M124 162 q3 -9 6 0 z" /><path d="M136 162 q3 -12 6 0 z" />
      </g>

      <!-- sartén que se sacude -->
      <g class="pan">
        <path d="M86 146 H158 Q162 146 162 150 V156 Q162 160 158 160 H90 Q86 160 86 156 Z" fill="#363f4e" />
        <path d="M160 150 H192 a4 4 0 0 1 0 8 H160 Z" fill="#4f5a6b" />
      </g>

      <!-- ingredientes que saltan -->
      <rect class="toss toss--1" x="102" y="138" width="5" height="11" rx="2.5" fill="#ec9060" />
      <circle class="toss toss--2" cx="124" cy="141" r="4.5" fill="#1fa88c" />
      <circle class="toss toss--3" cx="143" cy="141" r="5" fill="#d9553f" />

      <!-- vapor de la sartén -->
      <g fill="none" stroke="#8a94a4" stroke-width="2" stroke-linecap="round">
        <path class="steam" d="M104 130 q-4 -6 0 -11 q4 -5 0 -10" />
        <path class="steam steam--2" d="M124 130 q-4 -6 0 -11 q4 -5 0 -10" />
        <path class="steam steam--3" d="M144 130 q-4 -6 0 -11 q4 -5 0 -10" />
      </g>

      <!-- plato terminado, listo para llevar -->
      <g class="ready">
        <ellipse cx="52" cy="160" rx="22" ry="4" fill="#fff" stroke="#cdd3da" />
        <path d="M34 160 a18 16 0 0 1 36 0 z" fill="#e1e5ea" stroke="#8a94a4" stroke-width="1.5" />
        <circle cx="52" cy="141" r="3.2" fill="#8a94a4" />
      </g>
    </svg>
</div>
<div class="pointer-events-none absolute right-[2%] top-[30%] hidden w-[260px] xl:block 2xl:right-[4%] 2xl:w-[320px]" aria-hidden="true">
      <svg viewBox="0 0 360 300" class="block h-auto w-full" style="transform: rotate(-3deg)" role="presentation">
        <defs>
          <clipPath id="cs-carrot-clip"><rect x="0" y="0" width="196" height="300" /></clipPath>
        </defs>

        <!-- tabla -->
        <rect x="30" y="52" width="320" height="236" rx="24" fill="#262d39" opacity=".1" />
        <rect x="20" y="34" width="320" height="236" rx="24" fill="#cfa176" stroke="#b98a63" stroke-width="4" />
        <g fill="none" stroke="#c0905f" stroke-width="2" stroke-linecap="round" opacity=".8">
          <path d="M44 150 q60 -8 110 0 t120 -4" />
          <path d="M50 232 q70 -8 130 0 t110 -4" />
          <path d="M240 60 q30 -6 60 0" />
        </g>
        <ellipse cx="52" cy="62" rx="9" ry="7" fill="#f6f7f9" stroke="#b98a63" stroke-width="3" />

        <!-- verduras de adorno -->
        <g>
          <circle cx="284" cy="212" r="27" fill="#d9553f" />
          <circle cx="284" cy="212" r="20" fill="#e8806c" />
          <g fill="#f6d9a3"><ellipse cx="276" cy="206" rx="3" ry="5" /><ellipse cx="290" cy="204" rx="3" ry="5" /><ellipse cx="284" cy="220" rx="3" ry="5" /></g>
        </g>
        <g>
          <circle cx="96" cy="214" r="15" fill="#9be7d3" stroke="#1fa88c" stroke-width="3" />
          <circle cx="96" cy="214" r="9" fill="#c8f3e8" />
          <circle cx="132" cy="234" r="15" fill="#9be7d3" stroke="#1fa88c" stroke-width="3" />
          <circle cx="132" cy="234" r="9" fill="#c8f3e8" />
          <circle cx="62" cy="244" r="15" fill="#9be7d3" stroke="#1fa88c" stroke-width="3" />
          <circle cx="62" cy="244" r="9" fill="#c8f3e8" />
        </g>
        <g fill="#1fa88c">
          <path d="M150 196 q10 -16 24 -10 q-4 16 -24 10z" />
          <path d="M150 196 q-2 -18 12 -22 q6 14 -12 22z" />
          <path d="M150 196 q-16 -8 -12 -22 q16 0 12 22z" />
        </g>

        <!-- zanahoria: avanza hacia el cuchillo y lo que pasa la línea de corte se convierte en rodajas -->
        <g clip-path="url(#cs-carrot-clip)">
          <g class="carrot">
            <path d="M34 106 L150 95 Q215 88 215 106 Q215 124 150 117 Z" fill="#ec9060" />
            <path d="M34 106 L150 95 Q215 88 215 106 Q215 124 150 117 Z" fill="none" stroke="#d8733a" stroke-width="2" />
            <g stroke="#d8733a" stroke-width="2" stroke-linecap="round" opacity=".7">
              <path d="M70 105 l0 5" /><path d="M96 102 l0 8" /><path d="M124 100 l0 9" /><path d="M152 99 l0 10" /><path d="M176 98 l0 11" />
            </g>
          </g>
        </g>

        <!-- rodajas -->
        <g *ngFor="let n of slices" class="slice s{{ n }}">
          <rect x="222" y="93" width="11" height="25" rx="3" fill="#ec9060" stroke="#d8733a" stroke-width="2" />
          <path d="M227.5 98 v15" stroke="#d8733a" stroke-width="1.5" stroke-linecap="round" opacity=".6" />
        </g>

        <!-- cuchillo (visto desde arriba): la sombra se achica cuando baja a cortar -->
        <path class="knife-shadow" d="M196 148 L196 72 Q197 60 208 56 L218 60 L218 148 Z M197 146 h20 v72 a10 10 0 0 1 -20 0 z" fill="#262d39" opacity=".2" />
        <g class="knife">
          <rect x="197" y="144" width="20" height="76" rx="10" fill="#8a2a1c" />
          <g fill="#f6f7f9"><circle cx="207" cy="168" r="2.4" /><circle cx="207" cy="186" r="2.4" /><circle cx="207" cy="204" r="2.4" /></g>
          <path d="M196 148 L196 72 Q197 60 208 56 L218 60 L218 148 Z" fill="#e1e5ea" stroke="#8a94a4" stroke-width="2" stroke-linejoin="round" />
          <path d="M203 80 V140" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8" />
          <path d="M215 66 V142" stroke="#8a94a4" stroke-width="2" stroke-linecap="round" opacity=".6" />
          <rect x="195" y="143" width="24" height="7" rx="2" fill="#8a94a4" />
        </g>
      </svg>
</div>
