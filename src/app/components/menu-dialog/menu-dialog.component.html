<div class="relative flex flex-col h-full sm:max-h-[75vh] bg-white sm:rounded-dialog overflow-hidden sm:shadow-dialog">
  <!-- Header -->
  <div class="flex-shrink-0 bg-white px-5 pt-5 pb-3 sm:px-6 sm:pt-6">
    <div class="flex items-center justify-between pr-9">
      <div class="flex items-center gap-2.5">
        <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-cafe-green-50">
          <mat-icon class="!w-6 !h-6 !text-2xl text-cafe-green-700">restaurant_menu</mat-icon>
        </div>
        <div>
          <h2 class="text-lg sm:text-xl font-bold text-sage-900 m-0">Selecciona Menús</h2>
          <p class="text-sage-500 text-xs mt-0.5">Agrega items a tu orden</p>
        </div>
      </div>
      <button type="button" (click)="cancel()" aria-label="Cerrar" title="Cerrar"
        class="absolute right-1.5 top-1.5 z-10 grid h-10 w-10 place-items-center rounded-full text-sage-500 transition-colors hover:bg-sage-100 hover:text-sage-800 sm:right-3 sm:top-3">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="flex-shrink-0 px-5 pb-3 sm:px-6">
    <app-guide-hint [step]="3" title="Los platos" text="Tocá el + de cada plato para sumarlo al pedido y después Imprimir comanda para enviarlo a cocina."></app-guide-hint>
  </div>

  <!-- Contenido principal -->
  <!-- Un solo scroll en todo el diálogo: la búsqueda y las categorías quedan fijas arriba mientras se recorre la lista -->
  <div class="flex-1 min-h-0 overflow-y-auto custom-scrollbar px-4 sm:px-5 pb-3 sm:pb-4 bg-sage-50">
    <!-- Ítems seleccionados -->
    <div *ngIf="selectedItems.length > 0" class="mt-3 sm:mt-4 relative">
      <div class="bg-white border border-sage-200 rounded-xl p-3 shadow-sm">
        <p class="text-[11px] font-bold text-sage-400 mb-2">Seleccionado</p>

        <!-- Lista de items seleccionados -->
        <div class="space-y-1.5">
          <div
            *ngFor="let item of selectedItems"
            class="group bg-sage-50 rounded-lg border border-sage-100 px-2 py-1.5"
          >
            <div class="flex items-center gap-1.5">
              <small class="text-xs font-semibold text-sage-900 flex-1 min-w-0 truncate">{{ item.name }}</small>
              <span class="flex items-center justify-center min-w-[20px] h-5 px-1 bg-sage-200 text-sage-900 text-xs font-bold rounded flex-shrink-0">
                x{{ item.quantity }}
              </span>
              <button
                class="flex items-center justify-center w-5 h-5 rounded bg-cafe-red-50 hover:bg-cafe-red-100 text-cafe-red-600 transition-colors flex-shrink-0"
                (click)="removeSelectedItem(item)"
                aria-label="Eliminar"
              >
                <mat-icon class="!w-3 !h-3 !text-xs">close</mat-icon>
              </button>
            </div>
            <p *ngIf="item.selectedModifiers?.length" class="text-[11px] text-cafe-green-700 font-medium m-0 mt-0.5">
              <span *ngFor="let m of item.selectedModifiers; let last = last">+ {{ m.name }}<ng-container *ngIf="m.priceDelta"> ({{ m.priceDelta > 0 ? '+' : '' }}{{ m.priceDelta | money }})</ng-container><ng-container *ngIf="!last"> · </ng-container></span>
            </p>
            <div class="relative mt-1">
              <mat-icon class="!w-3.5 !h-3.5 !text-sm absolute left-1.5 top-1/2 -translate-y-1/2 text-sage-400">edit_note</mat-icon>
              <input
                type="text"
                [value]="item.note"
                (input)="updateNote(item, $event)"
                placeholder="Aclaración (ej: sin verduras)"
                class="w-full pl-6 pr-2 py-1 bg-white border border-sage-200 rounded text-xs focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700 transition-all placeholder-sage-300"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="sticky top-0 z-10 -mx-4 sm:-mx-5 px-4 sm:px-5 pt-3 sm:pt-4 pb-2 bg-sage-50">
    <!-- Campo de búsqueda -->
    <div class="mb-3 relative">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <mat-icon class="!w-5 !h-5 !text-xl text-sage-400">search</mat-icon>
        </div>
        <input
          type="text"
          class="w-full pl-10 pr-3 py-2 bg-white border border-sage-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700 transition-all placeholder-sage-400 shadow-sm"
          placeholder="Buscar menú..."
          [(ngModel)]="filterText"
        />
      </div>
    </div>

    <!-- Categorías -->
    <div *ngIf="categories.length > 0" #chips class="no-scrollbar flex gap-1.5 overflow-x-auto cursor-grab active:cursor-grabbing select-none" role="group" aria-label="Categorías"
      (wheel)="onChipsWheel($event, chips)" (mousedown)="onChipsDown($event, chips)" (mousemove)="onChipsMove($event, chips)" (mouseup)="onChipsUp()" (mouseleave)="onChipsUp()">
      <button type="button" (click)="pickCategory('all')"
        class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border transition-colors"
        [ngClass]="selectedCategory === 'all' ? 'bg-cafe-green-700 border-cafe-green-700 text-white' : 'bg-white border-sage-200 text-sage-700 hover:bg-sage-100'"
        [attr.aria-pressed]="selectedCategory === 'all'">Todo</button>
      <button *ngFor="let c of categories" type="button" (click)="pickCategory(c._id)"
        class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border transition-colors"
        [ngClass]="selectedCategory === c._id ? 'bg-cafe-green-700 border-cafe-green-700 text-white' : 'bg-white border-sage-200 text-sage-700 hover:bg-sage-100'"
        [attr.aria-pressed]="selectedCategory === c._id">{{ c.name }}</button>
      <button *ngIf="hasUncategorized" type="button" (click)="pickCategory('none')"
        class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border transition-colors"
        [ngClass]="selectedCategory === 'none' ? 'bg-cafe-green-700 border-cafe-green-700 text-white' : 'bg-white border-sage-200 text-sage-700 hover:bg-sage-100'"
        [attr.aria-pressed]="selectedCategory === 'none'">Sin categoría</button>
    </div>

    </div>

    <!-- Grid de items del menú -->
    <div class="space-y-2 pt-1">
      <div
        *ngFor="let menu of filteredMenuItems"
        class="group bg-white rounded-lg transition-all duration-300 overflow-hidden border"
        [ngClass]="isSelected(menu) ? 'border-cafe-green-700 ring-1 ring-cafe-green-700/30' : 'border-sage-100 hover:border-sage-300'"
      >
        <div class="p-2.5 sm:p-3">
          <div class="flex flex-row justify-between items-center gap-2">
            <!-- Info del producto -->
            <div class="flex-1 min-w-0">
              <small class="font-semibold text-sage-900 mb-1">{{ menu.name }}</small>
              <span *ngIf="hasModifiers(menu)" class="ml-1.5 px-1.5 py-0.5 rounded-full bg-cafe-green-50 text-cafe-green-700 text-[10px] font-bold align-middle">Opciones</span>
              <span *ngIf="menu.availableUnits === 0" class="ml-1.5 px-1.5 py-0.5 rounded-full bg-cafe-red-700 text-white text-[10px] font-bold align-middle">Agotado</span>
              <span *ngIf="menu.availableUnits !== null && menu.availableUnits !== undefined && menu.availableUnits > 0 && menu.availableUnits <= 5" class="ml-1.5 px-1.5 py-0.5 rounded-full bg-yellow-100 text-yellow-800 text-[10px] font-bold align-middle">Quedan {{ menu.availableUnits }}</span>
              <div class="flex items-center gap-1">
                <small class="font-semibold text-cafe-green-700">{{ menu.price }}</small>
              </div>
            </div>

            <!-- Controles -->
            <div class="flex flex-shrink-0 items-center gap-1.5">
              <!-- Control de cantidad -->
              <div class="flex items-center gap-1 bg-sage-50 rounded px-1.5 py-1 border border-sage-200">
                <input
                  class="w-12 px-1 py-0.5 bg-white border border-sage-200 rounded text-center text-xs font-bold focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25"
                  type="number"
                  min="1"
                  [value]="menu.quantity"
                  (input)="updateQuantity(menu, $event)"
                />
              </div>

              <!-- Botón Agregar -->
              <button
                type="button"
                class="w-9 h-9 flex-shrink-0 flex items-center justify-center rounded-full transition-all duration-200 active:scale-90 disabled:opacity-40 disabled:cursor-not-allowed"
                [ngClass]="addedItems[menu._id] ?
                  'bg-cafe-mint-500 text-[#0c1511] added-pop' :
                  (isSelected(menu) ? 'bg-cafe-green-700 text-white hover:bg-cafe-green-800' : 'bg-cafe-green-50 text-cafe-green-700 hover:bg-cafe-green-100')"
                (click)="addItem(menu)" [disabled]="menu.availableUnits === 0"
                [attr.aria-label]="(isSelected(menu) ? 'Agregar otra unidad de ' : 'Agregar ') + menu.name"
                [attr.title]="isSelected(menu) ? 'Agregado ×' + selectedQty(menu) : 'Agregar'"
              >
                <mat-icon class="!w-5 !h-5 !text-xl">{{ isSelected(menu) ? 'check' : 'add' }}</mat-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer con acciones -->
  <div class="flex-shrink-0 flex flex-col sm:flex-row justify-end items-stretch sm:items-center gap-2 px-3 sm:px-4 py-3 bg-white border-t border-sage-100">
    <button
      class="hidden sm:flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold bg-sage-50 hover:bg-sage-100 text-sage-700 transition-all duration-200"
      (click)="cancel()">
      <mat-icon class="!w-4 !h-4 !text-base">cancel</mat-icon>
      <span>Cancelar</span>
    </button>

    <button
      class="flex items-center justify-center gap-1 px-4 py-2.5 rounded-lg text-sm font-bold
             bg-cafe-green-700 hover:bg-cafe-green-800
             text-white transition-all duration-200
            
             disabled:opacity-50 disabled:cursor-not-allowed
             disabled:shadow-sm"
      (click)="printTicket()"
      [disabled]="selectedItems.length === 0 || !canPrint"
    >
      <mat-icon class="!w-4 !h-4 !text-base">print</mat-icon>
      <span>Imprimir Comanda</span>
    </button>

  </div>
</div>

<style>
  /* Rebote del botón al agregar un plato */
  .added-pop {
    animation: added-pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  @keyframes added-pop {
    0% { transform: scale(0.9); }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .added-pop { animation: none; }
  }
  .custom-scrollbar::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: #edf1ea;
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #86958b;
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #6a7a70;
  }
</style>
