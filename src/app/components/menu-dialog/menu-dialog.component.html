<div class="flex flex-col h-full max-h-[75vh] bg-white rounded-2xl overflow-hidden shadow-2xl">
  <!-- Header -->
  <div class="flex-shrink-0 px-4 sm:px-5 py-3 sm:py-4 bg-coffee-800">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-white/15">
          <mat-icon class="!w-6 !h-6 !text-2xl text-white">restaurant_menu</mat-icon>
        </div>
        <div>
          <h2 class="text-lg sm:text-xl font-bold text-white m-0">Selecciona Menús</h2>
          <p class="text-white/70 text-xs mt-0.5">Agrega items a tu orden</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="flex-1 overflow-y-auto px-4 sm:px-5 py-3 sm:py-4 bg-coffee-50">
    <!-- Ítems seleccionados -->
    <div *ngIf="selectedItems.length > 0" class="mb-3 relative">
      <div class="bg-white border border-coffee-200 rounded-xl p-3 shadow-sm">
        <p class="text-[11px] font-bold uppercase tracking-wide text-coffee-400 mb-2">Seleccionado</p>

        <!-- Lista de items seleccionados -->
        <div class="max-h-24 overflow-y-auto custom-scrollbar">
          <div class="flex flex-wrap gap-1">
            <div
              *ngFor="let item of selectedItems"
              class="group flex items-center gap-1 px-2 py-0.5 bg-coffee-50 rounded shadow-sm hover:shadow-md transition-all duration-300 border border-coffee-100"
            >
              <small class="text-xs font-semibold text-coffee-900">{{ item.name }}</small>
              <div class="flex items-center gap-1">
                <span class="flex items-center justify-center min-w-[20px] h-5 px-1 bg-coffee-200 text-coffee-900 text-xs font-bold rounded">
                  x{{ item.quantity }}
                </span>
                <button
                  class="flex items-center justify-center w-5 h-5 rounded bg-cafe-red-50 hover:bg-cafe-red-100 text-cafe-red-600 transition-colors opacity-0 group-hover:opacity-100"
                  (click)="removeSelectedItem(item)"
                  aria-label="Eliminar"
                >
                  <mat-icon class="!w-3 !h-3 !text-xs">close</mat-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Campo de búsqueda -->
    <div class="mb-3 relative">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <mat-icon class="!w-5 !h-5 !text-xl text-coffee-400">search</mat-icon>
        </div>
        <input
          type="text"
          class="w-full pl-10 pr-3 py-2 bg-white border border-coffee-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-coffee-500 focus:border-transparent transition-all placeholder-coffee-400 shadow-sm"
          placeholder="Buscar menú..."
          [(ngModel)]="filterText"
        />
      </div>
    </div>

    <!-- Grid de items del menú -->
    <div class="space-y-2 max-h-[45vh] overflow-y-auto custom-scrollbar pr-2">
      <div
        *ngFor="let menu of filteredMenuItems"
        class="group bg-white rounded-lg shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden border border-coffee-100 hover:border-coffee-300"
      >
        <div class="p-2.5 sm:p-3">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <!-- Info del producto -->
            <div class="flex-1 min-w-0">
              <small class="font-semibold text-coffee-900 mb-1">{{ menu.name }}</small>
              <div class="flex items-center gap-1">
                <small class="font-semibold text-cafe-green-700">{{ menu.price }}</small>
              </div>
            </div>

            <!-- Controles -->
            <div class="flex items-center gap-1.5 w-full sm:w-auto">
              <!-- Control de cantidad -->
              <div class="flex items-center gap-1 bg-coffee-50 rounded px-1.5 py-1 border border-coffee-200">
                <input
                  class="w-12 px-1 py-0.5 bg-white border border-coffee-200 rounded text-center text-xs font-bold focus:outline-none focus:ring-2 focus:ring-coffee-500"
                  type="number"
                  min="1"
                  [value]="menu.quantity"
                  (input)="updateQuantity(menu, $event)"
                />
              </div>

              <!-- Botón Agregar -->
              <button
                class="flex items-center justify-center gap-1 px-3 py-1.5 rounded text-xs font-bold transition-all duration-200 shadow-sm hover:shadow-md"
                [ngClass]="addedItems[menu._id] ?
                  'bg-cafe-green-700 text-white' :
                  'bg-coffee-700 hover:bg-coffee-800 text-white'"
                (click)="addItem(menu)"
              >
                <mat-icon class="!w-3.5 !h-3.5 !text-sm" *ngIf="!addedItems[menu._id]">add_circle</mat-icon>
                <mat-icon class="!w-3.5 !h-3.5 !text-sm" *ngIf="addedItems[menu._id]">check_circle</mat-icon>
                <span class="hidden sm:inline">{{ addedItems[menu._id] ? "Agregado" : "Agregar" }}</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer con acciones -->
  <div class="flex-shrink-0 flex flex-col sm:flex-row justify-end items-stretch sm:items-center gap-2 px-3 sm:px-4 py-3 bg-white border-t border-coffee-100">
    <button
      class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold bg-coffee-50 hover:bg-coffee-100 text-coffee-700 transition-all duration-200"
      (click)="cancel()">
      <mat-icon class="!w-4 !h-4 !text-base">cancel</mat-icon>
      <span>Cancelar</span>
    </button>

    <button
      class="flex items-center justify-center gap-1 px-4 py-2.5 rounded-lg text-sm font-bold
             bg-coffee-800 hover:bg-coffee-900
             text-white transition-all duration-200
             shadow-md hover:shadow-lg
             disabled:opacity-50 disabled:cursor-not-allowed
             disabled:shadow-sm"
      (click)="printTicket()"
      [disabled]="selectedItems.length === 0 || !canPrint"
    >
      <mat-icon class="!w-4 !h-4 !text-base">print</mat-icon>
      <span>Imprimir Comanda</span>
    </button>

  </div>
</div>

<style>
  .custom-scrollbar::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
    background: #f9f5f0;
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #8b6f47;
    border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #6f4e37;
  }
</style>
