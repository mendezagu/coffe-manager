<div class="w-full min-h-screen bg-sage-100 px-4 sm:px-6 lg:px-8 py-6 sm:py-8 lg:py-10">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="flex items-center gap-4 mb-6 sm:mb-8">
      <div class="flex items-center justify-center w-14 h-14 rounded-card bg-cafe-green-50">
        <mat-icon class="!w-8 !h-8 !text-3xl text-cafe-green-700">history</mat-icon>
      </div>
      <div>
        <h2 class="text-2xl sm:text-3xl font-bold text-sage-900">Historial de Acciones</h2>
        <p class="text-sage-500 text-sm mt-0.5">Registro de eventos administrativos</p>
      </div>
    </div>

    <!-- Empty state -->
    <div *ngIf="logs.length === 0" class="flex flex-col items-center justify-center py-16 bg-white rounded-card shadow-soft">
      <div class="w-16 h-16 rounded-full bg-sage-50 flex items-center justify-center mb-3">
        <mat-icon class="!w-10 !h-10 !text-4xl text-sage-300">inbox</mat-icon>
      </div>
      <p class="text-sage-600 text-base font-semibold">No hay acciones registradas</p>
    </div>

    <!-- Tabla -->
    <div *ngIf="logs.length > 0" class="bg-white rounded-card shadow-soft overflow-hidden">
      <table mat-table [dataSource]="logs" class="w-full">

        <!-- Columna: Fecha -->
        <ng-container matColumnDef="timestamp">
          <th mat-header-cell *matHeaderCellDef class="!bg-sage-50 !text-sage-500 !font-medium !text-xs"> Fecha </th>
          <td mat-cell *matCellDef="let log" class="!text-sage-700 !text-sm"> {{ log.timestamp | date: 'short' }} </td>
        </ng-container>

        <!-- Columna: Acción -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="!bg-sage-50 !text-sage-500 !font-medium !text-xs"> Acción </th>
          <td mat-cell *matCellDef="let log" class="!text-sage-900 !text-sm"> <span [innerHTML]="log.action"></span> </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:!bg-sage-50"></tr>
      </table>
    </div>

    <div class="flex justify-end mt-6">
      <button
        class="flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm bg-cafe-red-50 text-cafe-red-700 hover:bg-cafe-red-100 transition-all duration-200"
        (click)="clearLogs()"
      >
        <mat-icon class="!w-4 !h-4 !text-base">delete_sweep</mat-icon>
        Borrar Logs
      </button>
    </div>
  </div>
</div>
