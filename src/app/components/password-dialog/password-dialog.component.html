<div class="w-full bg-white rounded-2xl overflow-hidden shadow-2xl">
  <!-- Header -->
  <div class="relative bg-coffee-800 p-3 sm:p-4">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-white/15">
        <mat-icon class="!w-6 !h-6 !text-2xl text-white">lock</mat-icon>
      </div>
      <div>
        <h2 class="text-lg sm:text-xl font-bold text-white m-0">Verificación</h2>
        <p class="text-white/70 text-xs mt-0.5">Ingresa la contraseña para continuar</p>
      </div>
    </div>
  </div>

  <mat-dialog-content class="p-3 sm:p-4">
    <form (ngSubmit)="submit()">
      <label class="block text-xs font-bold uppercase tracking-wide text-coffee-500 mb-1.5">Contraseña</label>
      <div class="relative">
        <input
          [type]="hide ? 'password' : 'text'"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full pl-4 pr-11 py-2.5 border border-coffee-200 rounded-lg text-sm text-coffee-900 focus:outline-none focus:ring-2 focus:ring-coffee-500 focus:border-transparent transition-all"
        />
        <button
          type="button"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-coffee-400 hover:text-coffee-600"
          (click)="hide = !hide"
        >
          <mat-icon class="!w-5 !h-5 !text-xl">{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions class="flex flex-wrap gap-2 p-3 sm:p-4 bg-coffee-50 border-t border-coffee-100">
    <button
      class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg font-bold text-sm bg-white text-coffee-700 border border-coffee-200 shadow-sm hover:shadow-md transition-all duration-200"
      type="button"
      (click)="cancel()"
    >
      Cancelar
    </button>
    <button
      class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg font-bold text-sm bg-coffee-700 hover:bg-coffee-800 text-white transition-all duration-200 shadow-md hover:shadow-lg"
      type="submit"
      (click)="submit()"
    >
      Ingresar
    </button>
  </mat-dialog-actions>
</div>
