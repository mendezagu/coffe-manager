<div class="w-full bg-white rounded-dialog overflow-hidden shadow-dialog">
  <!-- Header -->
  <div class="relative bg-white px-5 pt-5 pb-3 sm:px-6 sm:pt-6">
    <div class="flex items-center gap-2.5">
      <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-cafe-green-50">
        <mat-icon class="!w-6 !h-6 !text-2xl text-cafe-green-700">lock</mat-icon>
      </div>
      <div>
        <h2 class="text-lg sm:text-xl font-bold text-sage-900 m-0">Verificación</h2>
        <p class="text-sage-500 text-xs mt-0.5">Ingresa la contraseña para continuar</p>
      </div>
    </div>
  </div>

  <mat-dialog-content class="p-3 sm:p-4">
    <form (ngSubmit)="submit()">
      <label class="block text-xs font-bold text-sage-500 mb-1.5">Contraseña</label>
      <div class="relative">
        <input
          [type]="hide ? 'password' : 'text'"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full pl-4 pr-11 py-2.5 border border-sage-200 rounded-lg text-sm text-sage-900 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25 focus:border-cafe-green-700 transition-all"
        />
        <button
          type="button"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-sage-400 hover:text-sage-600"
          (click)="hide = !hide"
        >
          <mat-icon class="!w-5 !h-5 !text-xl">{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions class="flex flex-wrap gap-2 p-3 sm:p-4 bg-white border-t border-sage-200">
    <button
      class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg font-bold text-sm bg-white text-sage-700 border border-sage-200 transition-all duration-200"
      type="button"
      (click)="cancel()"
    >
      Cancelar
    </button>
    <button
      class="flex-1 min-w-[100px] flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-lg font-bold text-sm bg-cafe-green-700 hover:bg-cafe-green-800 text-white transition-all duration-200"
      type="submit"
      (click)="submit()"
    >
      Ingresar
    </button>
  </mat-dialog-actions>
</div>
