<button type="button" (click)="close()" role="status" aria-live="polite"
  class="done-overlay flex w-full flex-col items-center justify-center gap-[6px] bg-white px-8 py-12 text-center focus:outline-none">
  <div class="done-badge grid h-[112px] w-[112px] place-items-center rounded-full bg-cafe-green-50 ring-[10px] ring-cafe-green-50/60">
    <svg viewBox="0 0 52 52" class="h-[64px] w-[64px]" fill="none" stroke="#084440" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle class="done-circle" cx="26" cy="26" r="22" />
      <path class="done-tick" d="M15 27l8 8 15-17" />
    </svg>
  </div>
  <div class="done-text mt-[18px] font-jakarta text-[26px] font-extrabold leading-tight tracking-tight text-sage-900">{{ data.title }}</div>
  <p *ngIf="data.sub" class="done-text m-0 max-w-[280px] text-[15px] text-sage-600">{{ data.sub }}</p>
</button>
