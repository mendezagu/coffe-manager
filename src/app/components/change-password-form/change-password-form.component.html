<form (ngSubmit)="submit()" class="flex flex-col gap-4" autocomplete="off">

  <div>
    <label for="cp-current" class="mb-1.5 block text-xs font-bold text-sage-500">
      {{ first ? 'Contraseña actual (la que te dieron)' : 'Contraseña actual' }}
    </label>
    <input id="cp-current" name="current" type="password" appPasswordToggle [(ngModel)]="current" autocomplete="current-password" required
      class="h-12 w-full rounded-lg border border-sage-200 px-4 text-sm text-sage-900 transition-all focus:border-cafe-green-700 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25" />
  </div>

  <div>
    <label for="cp-next" class="mb-1.5 block text-xs font-bold text-sage-500">Contraseña nueva</label>
    <input id="cp-next" name="next" type="password" appPasswordToggle [(ngModel)]="next" autocomplete="new-password" required minlength="8" maxlength="100"
      class="h-12 w-full rounded-lg border border-sage-200 px-4 text-sm text-sage-900 transition-all focus:border-cafe-green-700 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25" />
    <p class="m-0 mt-1.5 text-xs" [ngClass]="tooShort || sameAsCurrent ? 'font-medium text-cafe-red-700' : 'text-sage-500'">
      <ng-container *ngIf="sameAsCurrent; else lengthHint">Tiene que ser distinta de la actual.</ng-container>
      <ng-template #lengthHint>Al menos 8 caracteres.</ng-template>
    </p>
  </div>

  <div>
    <label for="cp-repeat" class="mb-1.5 block text-xs font-bold text-sage-500">Repetí la contraseña nueva</label>
    <input id="cp-repeat" name="repeat" type="password" appPasswordToggle [(ngModel)]="repeat" autocomplete="new-password" required maxlength="100"
      class="h-12 w-full rounded-lg border border-sage-200 px-4 text-sm text-sage-900 transition-all focus:border-cafe-green-700 focus:outline-none focus:ring-2 focus:ring-cafe-green-700/25" />
    <p *ngIf="mismatch" class="m-0 mt-1.5 text-xs font-medium text-cafe-red-700">Las contraseñas no coinciden.</p>
  </div>

  <p *ngIf="error" role="alert" class="m-0 rounded-lg bg-cafe-red-50 px-3 py-2 text-sm font-medium text-cafe-red-700">{{ error }}</p>
  <p *ngIf="done && !first" role="status" class="m-0 flex items-center gap-1.5 rounded-lg bg-cafe-green-50 px-3 py-2 text-sm font-medium text-cafe-green-800">
    <mat-icon class="!h-5 !w-5 !text-xl">check_circle</mat-icon>
    Contraseña actualizada.
  </p>

  <button type="submit" [disabled]="!valid || busy"
    class="h-12 rounded-xl bg-cafe-green-700 px-6 text-base font-bold text-white transition-colors hover:bg-cafe-green-800 disabled:cursor-not-allowed disabled:opacity-40">
    {{ busy ? 'Guardando…' : first ? 'Guardar y volver a ingresar' : 'Cambiar contraseña' }}
  </button>
</form>
