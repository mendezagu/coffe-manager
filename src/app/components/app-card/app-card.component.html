<div class="w-full min-h-screen bg-coffee-50 px-3 sm:px-6 lg:px-8 py-6 sm:py-8 lg:py-10">
  <div class="max-w-[1920px] mx-auto">
    <!-- Grid de cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-5 sm:gap-6 lg:gap-8">
      <div *ngFor="let table of tables" class="group">
        <!-- Card Principal -->
        <div class="relative rounded-2xl overflow-visible transition-all duration-300 ease-out hover:-translate-y-1 shadow-elegant hover:shadow-elegant-xl p-4 flex flex-col"
             [class.bg-cafe-green-700]="table.available && !table.controlledBy"
             [class.bg-cafe-red-700]="!table.available || table.controlledBy">

          <!-- Header con nombre, estado y logo -->
          <div class="flex items-start justify-between gap-2 mb-3">
            <div class="flex flex-col gap-1.5">
              <h3 class="text-xl font-bold text-white leading-none">
                {{ table.name }}
              </h3>
              <span class="inline-flex items-center gap-1.5 w-fit px-2.5 py-0.5 rounded-full bg-white/15 text-[11px] font-semibold uppercase tracking-wide text-white">
                <span class="w-1.5 h-1.5 rounded-full bg-white"></span>
                <ng-container *ngIf="table.available && !table.controlledBy; else ocupadaLabel">Libre</ng-container>
                <ng-template #ocupadaLabel>Ocupada</ng-template>
              </span>
            </div>

            <!-- Logo pequeño -->
            <div class="relative w-9 h-9 rounded-full overflow-hidden shadow-md flex-shrink-0 ring-2 ring-white/30">
              <img
                class="w-full h-full object-cover"
                src="./assets/nuovo-cafe.jpg"
                alt="table"
              />
            </div>
          </div>

          <!-- Sección de Mozo -->
          <div class="mb-2">
            <div class="px-3 py-2 bg-black/20 rounded-xl">
              <p class="text-[11px] font-bold uppercase tracking-wide text-white/65 mb-0.5">Mozo</p>
              <p class="font-semibold text-white text-sm" *ngIf="table.waiterName?.trim()">{{ table.waiterName }}</p>
              <p class="font-semibold text-white text-sm" *ngIf="!table.waiterName?.trim()">No asignado</p>
            </div>
          </div>

          <!-- Mesa controlada -->
          <div *ngIf="table.controlledBy" class="mb-2">
            <div class="px-3 py-2 bg-black/20 rounded-xl">
              <p class="text-[11px] font-bold uppercase tracking-wide text-white/65 mb-0.5">Administrada por</p>
              <p class="text-xs font-semibold text-white">{{ getTableNameById(table.controlledBy) }}</p>
            </div>
          </div>

          <!-- Mesas vinculadas -->
          <div *ngIf="table.linkedTables && table.linkedTables.length > 0" class="mb-2">
            <div class="px-3 py-2 bg-black/20 rounded-xl">
              <p class="text-[11px] font-bold uppercase tracking-wide text-white/65 mb-1.5">Vinculada con</p>
              <div class="flex flex-wrap gap-1">
                <span *ngFor="let linkedTableId of table.linkedTables"
                      class="inline-flex items-center px-2 py-0.5 bg-white/20 text-white rounded-lg text-xs font-semibold">
                  {{ getTableNameById(linkedTableId) }}
                </span>
              </div>
            </div>
          </div>

          <!-- Spacer para empujar acciones al fondo -->
          <div class="flex-1"></div>

          <!-- Botón Ordenar -->
          <button
            class="w-full flex items-center justify-center gap-2 px-3 py-2.5 text-sm font-bold rounded-xl transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg mb-2"
            [ngClass]="(table.orders && table.orders.length > 0) ? 'bg-white text-coffee-800 hover:bg-coffee-50' : 'bg-white/15 hover:bg-white/25 text-white border border-white/30'"
            (click)="orderButtonClicked(table)"
            [disabled]="table.controlledBy">
            <mat-icon class="!w-5 !h-5 !text-xl">restaurant_menu</mat-icon>
            <span>Ordenar</span>
          </button>

          <!-- Botones de gestión (cuando hay órdenes) -->
          <div *ngIf="table.orders && table.orders.length > 0" class="space-y-2">
            <!-- Fila de botones Órdenes y Total -->
            <div class="flex gap-2">
              <button
                class="flex-1 flex items-center justify-center gap-1.5 px-2 py-2 text-xs font-bold rounded-xl bg-white/15 hover:bg-white/25 text-white border border-white/30 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                (click)="openTableInfoDialog(table)"
                [disabled]="table.controlledBy">
                <mat-icon class="!w-4 !h-4 !text-base">receipt_long</mat-icon>
                <span>Órdenes</span>
              </button>

              <button
                *ngIf="(role$ | async) === 'admin'"
                class="flex-1 flex items-center justify-center gap-1.5 px-2 py-2 text-xs font-bold rounded-xl bg-white/15 hover:bg-white/25 text-white border border-white/30 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                (click)="openTotalDialog(table)"
                [disabled]="table.controlledBy">
                <mat-icon class="!w-4 !h-4 !text-base">payments</mat-icon>
                <span>Total</span>
              </button>
            </div>

            <!-- Botón Imprimir -->
            <button
              class="w-full flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-bold rounded-xl bg-white/15 hover:bg-white/25 text-white border border-white/30 transition-all duration-200"
              (click)="printTicket(table.id)">
              <mat-icon class="!w-4 !h-4 !text-base">print</mat-icon>
              <span>Imprimir Comanda</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
